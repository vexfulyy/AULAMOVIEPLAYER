<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Loading AulaPlayer</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #eafff3; background: radial-gradient(ellipse at center, #063a29, #00130f 72%); font-family: system-ui, sans-serif; }
    img { width: 190px; height: 190px; object-fit: cover; border-radius: 20px; }
    p { margin: 20px 0 14px; font-size: 13px; letter-spacing: .24em; text-transform: uppercase; color: #b6eecb; }
    .track { width: 220px; height: 3px; border-radius: 4px; overflow: hidden; background: #174f3b; }
    .bar { width: 40%; height: 100%; background: #42e889; box-shadow: 0 0 12px #42e889; animation: loading 1.3s ease-in-out infinite alternate; }
    @keyframes loading { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) { .bar { animation: none; width: 100%; } }
  </style>
</head>
<body>
  <img src="icon.png" alt="Aula">
  <p>Loading</p>
  <div class="track" role="progressbar" aria-label="Loading"><div class="bar"></div></div>
</body>
</html>
